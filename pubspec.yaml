name: simple_bible
description: "Simple Bible by CodeKraft: read, search and reflect on Scripture in your language, offline, with topics, daily reflections, notes and downloadable translations."
publish_to: 'none'
# major.minor.patch+build. The part after "+" is the Android versionCode and
# must go up with every upload to the Play Store.
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  intl: ^0.20.3
  lottie: ^3.3.1
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  responsive_sizer: ^3.3.1
  rich_text_controller: ^3.0.1
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.15
  objectbox_generator: ^5.3.2
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true

  assets:
    - asset/
    - asset/lotties/
    - asset/kjv.json
    
  fonts:
    - family: Myriad Pro
      fonts:
        # - asset: asset/Myriad Pro Semibold.ttf
        - asset: asset/Myriad Pro Light SemiExtended.otf
          weight: 400
    - family: Canterbury
      fonts:
        - asset: asset/Canterbury.ttf
          weight: 400